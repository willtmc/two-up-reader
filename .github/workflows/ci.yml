name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is installed
        run: command -v shellcheck >/dev/null 2>&1 || brew install shellcheck

      - name: Run test suite and strict checks
        run: ./scripts/test.sh

      - name: Build and verify app bundle
        run: |
          ./build.sh --build-only
          codesign --verify --deep --strict build/TwoUp.app
          test -s build/TwoUp.app/Contents/Resources/TwoUp.icns
